<!doctype html>
<!-- Joshua Brewster (MIT License) -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Marching Cubes — Bourke / MC33</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eee;
        color: #182c3a;
        font:
          14px system-ui,
          sans-serif;
      }
      header {
        padding: 14px 20px;
        background: #fff;
        border-bottom: 1px solid #ccd5dc;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 14px;
      }
      label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      select,
      button {
        padding: 6px 10px;
        font: inherit;
      }
      #status {
        margin: 10px 0 0;
        min-height: 20px;
      }
      #status.error {
        color: #a12222;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      section {
        min-width: 0;
      }
      h2 {
        margin: 12px 20px 0;
        min-height: 38px;
        font-size: 14px;
        font-weight: 500;
      }
      canvas {
        display: block;
        width: 100%;
        height: 65vh;
      }
      .hint {
        margin: 0 20px 12px;
        color: #596773;
      }
      @media (max-width: 420px) {
        main {
          grid-template-columns: 1fr;
        }
        canvas {
          height: 40vh;
        }
      }
      .demo-nav {
        position: sticky;
        top: 0;
        z-index: 5;
        background: #fff;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 14px;
        font-size: 12px;
      }
      .demo-nav a {
        display: block;
        padding: 6px 9px;
        border: 1px solid #8298b266;
        border-radius: 5px;
        text-decoration: none;
      }
      .demo-nav a[aria-current="page"] {
        background: #8298b233;
        font-weight: 600;
      }
      .demo-nav a:hover {
        background: #8298b244;
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="demo-nav" aria-label="Demos">
        <a href="index.html?demo=sphere" aria-current="page">Sphere</a
        ><a href="index.html?demo=terrain">Terrain</a
        ><a href="index.html?demo=space">Infinite space</a>
      </nav>
      <h1>Marching Cubes — Bourke / MC33</h1>
      <div class="controls">
        <label
          >Algorithm
          <select id="algorithm">
            <option value="bourke">Bourke isosurfaces</option>
            <option value="mc33">Marching Cubes 33</option>
          </select></label
        >
        <label
          >Compute
          <select id="backend">
            <option value="cpu">CPU</option>
            <option value="gpu">WebGPU</option>
          </select></label
        >
        <label
          >Coordinates
          <select id="coordinates">
            <option value="cartesian">Cartesian</option>
            <option value="spherical">Spherical</option>
            <option value="cube-sphere">Cube-sphere (cloud mapping)</option>
          </select></label
        >
        <label
          >Surface
          <select id="surface">
            <option value="outer">Outer only</option>
            <option value="inner">Inner only</option>
            <option value="both">Both</option>
          </select></label
        >
        <label
          >Shell thickness
          <input
            id="thickness"
            type="number"
            value="0.004"
            min="0.0001"
            step="0.001"
            style="width: 80px"
        /></label>
        <label
          >Surface offset
          <input
            id="isolevel"
            type="number"
            value="0"
            step="0.001"
            style="width: 80px"
        /></label>
        <button id="rebuild" type="button">Rebuild mesh</button>
        <label><input id="wireframe" type="checkbox" /> Wireframe</label>
      </div>
      <p id="status" role="status" aria-live="polite">
        Preparing the point cloud and scalar field…
      </p>
    </header>
    <main>
      <section>
        <h2>Source point cloud</h2>
        <canvas id="pointCanvas"></canvas>
      </section>
      <section>
        <h2 id="meshLabel">Isosurface</h2>
        <canvas id="meshCanvas"></canvas>
      </section>
    </main>
    <p class="hint">
      The outer surface fits the source sphere at offset 0. The inner surface
      sits one shell thickness inside it. Both views share the same camera
      scale.
    </p>
  </body>
</html>
